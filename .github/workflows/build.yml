name: Build

on:
  push:
    branches: [master, main, "feat/**", "fix/**", "ci/**", "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Android APK, arm64-v8a only.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # setup-gradle owns the Gradle wrapper, dependency and project build caches.
      # Do not cache generated APKs or build directories across commits.
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble arm64 release APK
        run: ./gradlew :androidApp:assembleRelease -PlazerAbis=arm64-v8a --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: lazer-apk-arm64
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Windows x64 MSI, portable app image, and runnable fat jar.
  desktop:
    # windows-2022 supplies the Visual Studio 2022 C++ toolchain used by the x64 taskbar bridge.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # setup-gradle caches Gradle toolchain/dependencies and the project build cache. MSVC and
      # CMake come from the versioned hosted runner image; generated native output is never cached.
      - uses: gradle/actions/setup-gradle@v6
      # jpackage needs WiX to produce an .msi.
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Test desktop media integration
        shell: pwsh
        run: .\gradlew.bat :desktopApp:test -PwindowsArch=x64 --stacktrace
      - name: Build Windows x64 runnable jar
        shell: pwsh
        run: |
          .\gradlew.bat :desktopApp:packageUberJarForCurrentOS -PwindowsArch=x64 -PembedTaskbarBridge --stacktrace
          $jar = Get-ChildItem 'desktopApp/build/compose/jars' -Filter '*.jar' | Select-Object -First 1
          if ($null -eq $jar) { throw 'Windows runnable JAR was not created.' }
          $entries = & "$env:JAVA_HOME/bin/jar.exe" tf $jar.FullName
          if ($entries -notcontains 'native/windows-x64/lazer-taskbar-bridge.dll') {
            throw 'Windows runnable JAR is missing the taskbar bridge DLL.'
          }
          New-Item -ItemType Directory -Force -Path 'desktopApp/build/compose/binaries' | Out-Null
          Copy-Item -LiteralPath $jar.FullName -Destination 'desktopApp/build/compose/binaries/Lazer-windows-x64.jar'
      - name: Build portable Windows app
        shell: pwsh
        run: .\gradlew.bat :desktopApp:createReleaseDistributable -PwindowsArch=x64 --stacktrace
      - name: Verify portable Windows runtime
        shell: pwsh
        run: |
          $app = Get-ChildItem 'desktopApp/build/compose/binaries/main-release/app' -Directory | Select-Object -First 1
          if ($null -eq $app) { throw 'Compose app image was not created.' }
          $runtimeRelease = Get-Content "$($app.FullName)/runtime/release" -Raw
          if ($runtimeRelease -notmatch 'java\.net\.http') {
            throw 'Portable runtime is missing the java.net.http module required by DesktopAudioCache.'
          }
          $cioJar = Get-ChildItem "$($app.FullName)/app" -Filter 'ktor-client-cio-jvm-*.jar' | Select-Object -First 1
          if ($null -eq $cioJar) { throw 'Ktor CIO engine jar was not packaged.' }
          $entries = & "$env:JAVA_HOME/bin/jar.exe" tf $cioJar.FullName
          if ($entries -notcontains 'io/ktor/client/engine/cio/CIOEngineContainer.class') {
            throw 'Portable Ktor CIO jar is missing its ServiceLoader provider class.'
          }
          foreach ($file in @(
            "$($app.FullName)/app/resources/native/windows-x64/lazer-taskbar-bridge.dll",
            "$($app.FullName)/app/resources/media-control/light/play.ico",
            "$($app.FullName)/app/resources/media-control/dark/play.ico"
          )) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Portable app is missing $file" }
          }
      - name: Archive portable Windows app
        shell: pwsh
        run: |
          $app = Get-ChildItem 'desktopApp/build/compose/binaries/main-release/app' -Directory | Select-Object -First 1
          if ($null -eq $app) { throw 'Compose app image was not created.' }
          tar.exe -a -c -f 'desktopApp/build/compose/binaries/Lazer-windows-x64-portable.zip' -C $app.Parent.FullName $app.Name
      # Upload the portable packages before the installer so they remain available if a later
      # installer-specific failure needs diagnosis.
      - uses: actions/upload-artifact@v7
        with:
          name: lazer-jar-windows-x64
          path: desktopApp/build/compose/binaries/Lazer-windows-x64.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: lazer-windows-x64-portable
          path: desktopApp/build/compose/binaries/*-windows-x64-portable.zip
          if-no-files-found: error
      - name: Build MSI
        shell: pwsh
        run: .\gradlew.bat :desktopApp:packageMsi -PwindowsArch=x64 --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: lazer-msi
          path: desktopApp/build/compose/binaries/**/*.msi
          if-no-files-found: error

  # Linux x64 packages plus a real single-file AppImage. Ubuntu 22.04 provides a conservative
  # glibc baseline for the AppImage while jpackage produces the native deb/rpm packages.
  linux-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # setup-gradle owns Gradle toolchain/dependency and project build caches.
      - uses: gradle/actions/setup-gradle@v6
      - name: Set the DSD FFmpeg SDK path
        run: echo "FFMPEG_ROOT=$RUNNER_TEMP/lazer-ffmpeg" >> "$GITHUB_ENV"
      - name: Install Linux packaging and HiFi build dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm pkg-config cmake g++ nasm libasound2-dev
      - name: Build the pinned DSD-capable FFmpeg SDK
        run: bash native/lazer-audio/tools/build_dsd_ffmpeg.sh "$FFMPEG_ROOT"
      - name: Record Linux HiFi toolchain versions
        run: |
          set -euo pipefail
          cat /etc/os-release
          cmake --version
          c++ --version
          cat "$FFMPEG_ROOT/share/lazer-ffmpeg/BUILDINFO.txt"
          export PKG_CONFIG_PATH="$FFMPEG_ROOT/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          for module in alsa libavformat libavcodec libavutil libswresample; do
            version="$(pkg-config --modversion "$module")"
            printf '%s %s\n' "$module" "$version"
          done
      - name: Build Linux HiFi native engine and offline probes
        run: |
          set -euo pipefail
          build_dir="desktopApp/build/native/lazer-audio/linux-x64"
          fixture_dir="$RUNNER_TEMP/lazer-dsf-fixtures"
          cmake -S native/lazer-audio -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Release -DLAZER_FFMPEG_ROOT="$FFMPEG_ROOT" \
            -DLAZER_AUDIO_BUILD_PROBE=ON \
            -DLAZER_AUDIO_TEST_ALLOW_ALSA_NULL=ON
          cmake --build "$build_dir" --config Release --parallel 2
          ldd -r "$build_dir/liblazer-audio.so"
          ctest --test-dir "$build_dir" -C Release --output-on-failure
          python3 native/lazer-audio/tools/generate_dsf_test_fixtures.py "$fixture_dir" \
            --duration-ms 4000 --rates 64
          "$build_dir/lazer-audio-source-probe" "$fixture_dir/dsd64_test.dsf" 44100 \
            "$fixture_dir/full.raw" 2301 "$fixture_dir/seek.raw"
          "$build_dir/lazer-audio-source-probe" "$fixture_dir/dsd64_test.dsf" 96000 \
            "$fixture_dir/full-96k.raw" 2301 "$fixture_dir/seek-96k.raw"
          "$build_dir/lazer-audio-source-probe" "$fixture_dir/dsd64_test.dsf" --dop \
            "$fixture_dir/dop-full.raw" 2301 "$fixture_dir/dop-seek.raw"
          "$build_dir/lazer-audio-source-probe" "$fixture_dir/dsd64_test.dsf" 44100 \
            - end "$fixture_dir/end-44k.raw"
          "$build_dir/lazer-audio-source-probe" "$fixture_dir/dsd64_test.dsf" 96000 \
            - end "$fixture_dir/end-96k.raw"
          "$build_dir/lazer-audio-source-probe" "$fixture_dir/dsd64_test.dsf" --dop \
            - end "$fixture_dir/end-dop.raw"
          test ! -s "$fixture_dir/end-44k.raw"
          test ! -s "$fixture_dir/end-96k.raw"
          test ! -s "$fixture_dir/end-dop.raw"
      - name: Test desktop media integration and Linux ALSA ABI
        env:
          JAVA_TOOL_OPTIONS: -Dlazer.audio.library=${{ github.workspace }}/desktopApp/build/native/lazer-audio/linux-x64/liblazer-audio.so
        run: ./gradlew :desktopApp:test -PlazerNativeAudio=false --stacktrace
      - name: Build deb and rpm packages
        run: |
          set -euo pipefail
          native_args=()
          # Keep native ALSA experimental packages out of version-tag releases until runtime
          # dependency metadata and clean-install tests are verified on Debian and RPM systems.
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            native_args=(-PlazerNativeAudio=true)
          else
            native_args=(-PlazerNativeAudio=false)
          fi
          ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseRpm "${native_args[@]}" --stacktrace
      - name: Build Linux app image
        run: |
          set -euo pipefail
          native_args=()
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            native_args=(-PlazerNativeAudio=true)
          else
            native_args=(-PlazerNativeAudio=false)
          fi
          ./gradlew :desktopApp:createReleaseDistributable "${native_args[@]}" --stacktrace
      - name: Build Linux x64 runnable jar
        run: |
          set -euo pipefail
          native_args=()
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            native_args=(-PlazerNativeAudio=true)
          else
            native_args=(-PlazerNativeAudio=false)
          fi
          ./gradlew :desktopApp:packageUberJarForCurrentOS "${native_args[@]}" --stacktrace
          jar_file="$(find desktopApp/build/compose/jars -maxdepth 1 -name '*.jar' -print -quit)"
          test -n "$jar_file"
          cp "$jar_file" desktopApp/build/compose/binaries/Lazer-linux-x64.jar
      - name: Verify Linux native package profile
        run: |
          set -euo pipefail
          jar_file="desktopApp/build/compose/binaries/Lazer-linux-x64.jar"
          app_bundle="$(find desktopApp/build/compose/binaries/main-release/app -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$app_bundle"
          deb_file="$(find desktopApp/build/compose/binaries -name '*.deb' -print -quit)"
          rpm_file="$(find desktopApp/build/compose/binaries -name '*.rpm' -print -quit)"
          test -n "$deb_file"
          test -n "$rpm_file"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ! jar tf "$jar_file" | grep -Fx 'native/linux-x64/liblazer-audio.so'
            test ! -e "$app_bundle/app/resources/native/linux-x64/liblazer-audio.so"
            ! dpkg-deb -c "$deb_file" | grep -E 'app/resources/native/linux-x64/liblazer-audio\.so$'
            ! rpm -qpl "$rpm_file" | grep -E '/app/resources/native/linux-x64/liblazer-audio\.so$'
          else
            jar tf "$jar_file" | grep -Fx 'native/linux-x64/liblazer-audio.so'
            jar tf "$jar_file" | grep -Fx 'legal/ffmpeg/COPYING.LGPLv2.1'
            jar tf "$jar_file" | grep -Fx 'legal/ffmpeg/BUILDINFO.txt'
            jar tf "$jar_file" | grep -E '^native/linux-x64/libavformat\.so(\..*)?$'
            jar tf "$jar_file" | grep -E '^native/linux-x64/libavcodec\.so(\..*)?$'
            jar tf "$jar_file" | grep -E '^native/linux-x64/libavutil\.so(\..*)?$'
            jar tf "$jar_file" | grep -E '^native/linux-x64/libswresample\.so(\..*)?$'
            test -f "$app_bundle/app/resources/native/linux-x64/liblazer-audio.so"
            test -f "$app_bundle/app/resources/legal/ffmpeg/COPYING.LGPLv2.1"
            test -f "$app_bundle/app/resources/legal/ffmpeg/BUILDINFO.txt"
            dpkg-deb -c "$deb_file" | grep -E 'app/resources/native/linux-x64/liblazer-audio\.so$'
            dpkg-deb -c "$deb_file" | grep -E 'app/resources/legal/ffmpeg/COPYING\.LGPLv2\.1$'
            dpkg-deb -c "$deb_file" | grep -E 'app/resources/legal/ffmpeg/BUILDINFO\.txt$'
            rpm -qpl "$rpm_file" | grep -E '/app/resources/native/linux-x64/liblazer-audio\.so$'
            rpm -qpl "$rpm_file" | grep -E '/app/resources/legal/ffmpeg/COPYING\.LGPLv2\.1$'
            rpm -qpl "$rpm_file" | grep -E '/app/resources/legal/ffmpeg/BUILDINFO\.txt$'
          fi
      - name: Verify Linux ALSA package dependencies and installed library loading
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          deb_file="$(find desktopApp/build/compose/binaries -name '*.deb' -print -quit)"
          rpm_file="$(find desktopApp/build/compose/binaries -name '*.rpm' -print -quit)"
          test -n "$deb_file"
          test -n "$rpm_file"
          deb_file="$(realpath "$deb_file")"
          rpm_file="$(realpath "$rpm_file")"
          deb_dependencies="$(dpkg-deb -f "$deb_file" Depends)"
          printf 'DEB Depends: %s\n' "$deb_dependencies"
          [[ "$deb_dependencies" == *libasound2* || "$deb_dependencies" == *libasound2t64* ]]
          rpm -qp --requires "$rpm_file" | tee "$RUNNER_TEMP/lazer-rpm-requires.txt"
          grep -Eq '^alsa-lib([[:space:](:]|$)' "$RUNNER_TEMP/lazer-rpm-requires.txt"

          sudo apt-get install -y "$deb_file"
          installed_native="$(dpkg -L dev.naominet.lazer | grep -E '/app/resources/native/linux-x64/liblazer-audio\.so$' | head -n 1)"
          test -n "$installed_native"
          test -f "$installed_native"
          relocated_sdk="$RUNNER_TEMP/lazer-ffmpeg-build-sdk"
          mv "$FFMPEG_ROOT" "$relocated_sdk"
          test ! -e "$FFMPEG_ROOT"
          native_dir="$(dirname "$installed_native")"
          ldd -r "$installed_native" | tee "$RUNNER_TEMP/lazer-installed-native-deps.txt"
          for component in avformat avcodec avutil swresample; do
            grep -F "$native_dir/lib$component.so" "$RUNNER_TEMP/lazer-installed-native-deps.txt"
          done
          JAVA_TOOL_OPTIONS="-Dlazer.audio.library=$installed_native" \
            ./gradlew :desktopApp:test --tests 'dev.naominet.lazer.DesktopAudioOutputDeviceTest' \
              -PlazerNativeAudio=false --no-daemon --rerun-tasks --stacktrace
      - name: Assemble AppImage
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$(find desktopApp/build/compose/binaries/main-release/app -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$bundle_dir"
          app_dir="desktopApp/build/appimage/Lazer.AppDir"
          rm -rf "$app_dir"
          mkdir -p "$app_dir/usr/lib/lazer" "$app_dir/usr/bin" \
            "$app_dir/usr/share/applications" "$app_dir/usr/share/icons/hicolor/256x256/apps"
          cp -a "$bundle_dir/." "$app_dir/usr/lib/lazer/"
          ln -s ../lib/lazer/bin/dev.naominet.lazer "$app_dir/usr/bin/dev.naominet.lazer"
          cp desktopApp/src/main/resources/icon.png "$app_dir/usr/share/icons/hicolor/256x256/apps/dev.naominet.lazer.png"
          cat > "$app_dir/usr/share/applications/dev.naominet.lazer.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Lazer
          Comment=Music player
          Exec=dev.naominet.lazer
          Icon=dev.naominet.lazer
          Categories=AudioVideo;Audio;Player;
          Terminal=false
          EOF
          ln -s usr/share/applications/dev.naominet.lazer.desktop "$app_dir/dev.naominet.lazer.desktop"
          ln -s usr/share/icons/hicolor/256x256/apps/dev.naominet.lazer.png "$app_dir/dev.naominet.lazer.png"
          cat > "$app_dir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/dev.naominet.lazer" "$@"
          EOF
          chmod +x "$app_dir/AppRun"
          curl -fsSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$app_dir" \
            "desktopApp/build/compose/binaries/Lazer-x86_64.AppImage"
          appimage_check_dir="$RUNNER_TEMP/lazer-appimage-check"
          mkdir -p "$appimage_check_dir"
          (
            cd "$appimage_check_dir"
            "$GITHUB_WORKSPACE/desktopApp/build/compose/binaries/Lazer-x86_64.AppImage" --appimage-extract
          )
          appimage_root="$appimage_check_dir/squashfs-root"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test ! -e "$appimage_root/usr/lib/lazer/app/resources/native/linux-x64/liblazer-audio.so"
          else
            test -f "$appimage_root/usr/lib/lazer/app/resources/native/linux-x64/liblazer-audio.so"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: lazer-deb-x64
          path: desktopApp/build/compose/binaries/**/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: lazer-rpm-x64
          path: desktopApp/build/compose/binaries/**/*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: lazer-appimage-x64
          path: desktopApp/build/compose/binaries/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: lazer-jar-linux-x64
          path: desktopApp/build/compose/binaries/Lazer-linux-x64.jar
          if-no-files-found: error

  # Compile and run the native CoreAudio HAL backend plus host-independent HiFi probes on macOS.
  macos-coreaudio:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Set the DSD FFmpeg SDK path
        run: echo "FFMPEG_ROOT=$RUNNER_TEMP/lazer-ffmpeg" >> "$GITHUB_ENV"
      - name: Install native audio dependencies
        run: brew install cmake pkg-config
      - name: Build the pinned DSD-capable FFmpeg SDK
        run: bash native/lazer-audio/tools/build_dsd_ffmpeg.sh "$FFMPEG_ROOT"
      - name: Record CoreAudio build toolchain
        run: |
          set -euo pipefail
          sw_vers
          cmake --version
          clang++ --version
          cat "$FFMPEG_ROOT/share/lazer-ffmpeg/BUILDINFO.txt"
          export PKG_CONFIG_PATH="$FFMPEG_ROOT/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          for module in libavformat libavcodec libavutil libswresample; do
            pkg-config --modversion "$module"
          done
      - name: Build CoreAudio HAL engine and offline probes
        run: |
          set -euo pipefail
          build_dir="build/native/lazer-audio/macos-arm64"
          fixture_dir="$RUNNER_TEMP/lazer-dsf-fixtures"
          cmake -S native/lazer-audio -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Release -DLAZER_FFMPEG_ROOT="$FFMPEG_ROOT" \
            -DLAZER_AUDIO_BUILD_PROBE=ON
          cmake --build "$build_dir" --config Release --parallel 2
          dylib_dependencies="$(otool -L "$build_dir/liblazer-audio.dylib")"
          printf '%s\n' "$dylib_dependencies"
          if grep -F "$FFMPEG_ROOT" <<<"$dylib_dependencies"; then
            echo "The CoreAudio engine must resolve bundled FFmpeg via @rpath, not its build SDK." >&2
            exit 1
          fi
          for component in libavformat libavcodec libavutil libswresample; do
            if ! grep -Fq "@rpath/$component." <<<"$dylib_dependencies"; then
              echo "The CoreAudio engine must link $component through its bundled @rpath install name." >&2
              exit 1
            fi
          done
          engine_load_commands="$(otool -l "$build_dir/liblazer-audio.dylib")"
          if ! grep -Fq 'path @loader_path' <<<"$engine_load_commands"; then
            echo "The CoreAudio engine must search beside itself for bundled FFmpeg dylibs." >&2
            exit 1
          fi
          shopt -s nullglob
          ffmpeg_dylibs=("$build_dir"/libav*.dylib "$build_dir"/libswresample*.dylib)
          if ((${#ffmpeg_dylibs[@]} == 0)); then
            echo "The CoreAudio build must copy its FFmpeg dylibs beside the engine." >&2
            exit 1
          fi
          for dylib in "${ffmpeg_dylibs[@]}"; do
            dependencies="$(otool -L "$dylib")"
            if grep -F "$FFMPEG_ROOT" <<<"$dependencies"; then
              echo "Bundled FFmpeg dylib $dylib retains a dependency on the build SDK." >&2
              exit 1
            fi
            install_id="$(otool -D "$dylib" | sed -n '2p')"
            if [[ "$install_id" != @rpath/* ]]; then
              echo "Bundled FFmpeg dylib $dylib has non-relocatable install ID: $install_id" >&2
              exit 1
            fi
          done
          ctest --test-dir "$build_dir" -C Release --output-on-failure
          python3 native/lazer-audio/tools/generate_dsf_test_fixtures.py "$fixture_dir" \
            --duration-ms 4000 --rates 64
          "$build_dir/lazer-audio-source-probe" "$fixture_dir/dsd64_test.dsf" 44100 \
            "$fixture_dir/full.raw" 2301 "$fixture_dir/seek.raw"
          "$build_dir/lazer-audio-source-probe" "$fixture_dir/dsd64_test.dsf" --dop \
            "$fixture_dir/dop-full.raw" 2301 "$fixture_dir/dop-seek.raw"
          relocated_sdk="$RUNNER_TEMP/lazer-ffmpeg-build-sdk"
          mv "$FFMPEG_ROOT" "$relocated_sdk"
          test ! -e "$FFMPEG_ROOT"
      - name: Test desktop media integration and CoreAudio ABI
        env:
          JAVA_TOOL_OPTIONS: -Dlazer.audio.library=${{ github.workspace }}/build/native/lazer-audio/macos-arm64/liblazer-audio.dylib
        run: ./gradlew :desktopApp:test -PlazerNativeAudio=false --stacktrace

  # Compile the Kotlin/Native framework, run shared iOS tests, then let Xcode compile and link the
  # real SwiftUI + Compose application. The macOS 26 image supplies Xcode 26 for Liquid Glass APIs.
  #
  # The simulator smoke test and the unsigned device build are separate jobs on purpose: they need
  # different Kotlin/Native build types (debug vs release), so neither can reuse the other's work,
  # and running them one after another on a single runner made the job as long as both together.
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # setup-gradle owns the Gradle caches but not ~/.konan, where Kotlin/Native unpacks its own
      # compiler and LLVM on first use. A hosted macOS runner starts without it, so every job used to
      # re-download and re-unpack roughly a gigabyte before compiling a single line.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Test shared code on iOS Simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
      # A successful compile does not prove that Compose and the native shell survive startup.
      # Boot a real simulator, install the built app, and keep it alive long enough to catch the
      # launch-time failures that otherwise look like an immediate bounce back to the home screen.
      - name: Build and launch iOS Simulator app
        run: |
          set -euo pipefail
          simulator_udid="$(
            xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          devices_by_runtime = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices_by_runtime, reverse=True):
              for device in devices_by_runtime[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found.")
          '
          )"
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$simulator_udid" \
            -derivedDataPath iosApp/build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee ios-simulator-xcodebuild.log
          app_path="$(find iosApp/build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          xcrun simctl install "$simulator_udid" "$app_path"
          # --console remains attached to the app and captures Kotlin/Native and Swift fatal output.
          # Running it in the background lets this step enforce a startup survival window.
          xcrun simctl launch --terminate-running-process --console \
            "$simulator_udid" "$bundle_id" > ios-simulator-console.log 2>&1 &
          console_pid=$!
          # Wait for the first frame to announce itself rather than holding a fixed window: a cold
          # simulator compiles its Metal shaders on the first draw, which on a slow runner has taken
          # well past half a minute, while a launch that dies early is noticed immediately instead of
          # after a long sleep. The route walk below waits the same way.
          for attempt in $(seq 1 90); do
            if grep -q 'LAZER_IOS_COMPOSE_READY' ios-simulator-console.log; then
              break
            fi
            if ! kill -0 "$console_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if ! kill -0 "$console_pid" 2>/dev/null; then
            set +e
            wait "$console_pid"
            launch_status=$?
            set -e
            xcrun simctl spawn "$simulator_udid" log show \
              --last 2m \
              --style compact \
              --predicate "process == 'Lazer' OR eventMessage CONTAINS '$bundle_id'" \
              > ios-simulator-runtime.log || true
            mkdir -p ios-simulator-crash-reports
            find "$HOME/Library/Logs/DiagnosticReports" \
              -maxdepth 1 \
              -type f \
              \( -name 'Lazer*.ips' -o -name 'Lazer*.crash' \) \
              -mmin -5 \
              -exec cp '{}' ios-simulator-crash-reports/ \; 2>/dev/null || true
            echo 'App console output:'
            cat ios-simulator-console.log
            echo 'Recent simulator runtime output:'
            cat ios-simulator-runtime.log
            console_summary="$(tail -n 40 ios-simulator-console.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | paste -sd '|' -)"
            echo "::error::Lazer exited during the iOS launch smoke test (status $launch_status). $console_summary"
            exit 1
          fi
          xcrun simctl io "$simulator_udid" screenshot ios-simulator.png
          if ! grep -q 'LAZER_IOS_COMPOSE_READY' ios-simulator-console.log; then
            # A process that is alive but has drawn nothing is stalled, so ask the system where it
            # is sitting before anything is torn down. The simulator runs the app as an ordinary
            # host process, so sample it from the host: `simctl spawn sample` writes its file inside
            # the simulated filesystem, where the `head` below can never reach it.
            sample Lazer 3 -file ios-simulator-sample.txt || true
            xcrun simctl spawn "$simulator_udid" log show \
              --last 2m --style compact --predicate "process == 'Lazer'" \
              > ios-simulator-runtime.log || true
            echo 'App console output:'
            cat ios-simulator-console.log
            echo 'Stacks sampled from the running app:'
            head -n 80 ios-simulator-sample.txt || true
            echo 'Recent simulator runtime output:'
            tail -n 60 ios-simulator-runtime.log || true
            xcrun simctl terminate "$simulator_udid" "$bundle_id" || true
            wait "$console_pid" || true
            echo '::error::Lazer stayed alive but did not commit its first Compose frame.'
            exit 1
          fi
          xcrun simctl terminate "$simulator_udid" "$bundle_id"
          wait "$console_pid" || true
          # One home screen proves little: a page that only fails once it is opened is invisible in
          # that shot. Each route gets its own process, its own screenshot and the same survival
          # check, driven through the app's own navigation rather than a test-only fixture.
          for route in search library me settings about login player queue playlist comments; do
            xcrun simctl launch --terminate-running-process --console \
              "$simulator_udid" "$bundle_id" "LAZER_IOS_ROUTE=$route" \
              > "ios-simulator-$route-console.log" 2>&1 &
            route_pid=$!
            # Wait for the page to announce itself rather than holding a fixed window: the marker
            # normally lands within a couple of seconds, while a slow route still gets its full
            # grace and one that dies early is noticed immediately instead of after a long sleep.
            for attempt in $(seq 1 20); do
              if grep -q "LAZER_IOS_ROUTE_APPLIED $route" "ios-simulator-$route-console.log"; then
                break
              fi
              if ! kill -0 "$route_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            sleep 2
            xcrun simctl io "$simulator_udid" screenshot "ios-simulator-$route.png"
            if ! grep -q "LAZER_IOS_ROUTE_APPLIED $route" "ios-simulator-$route-console.log"; then
              echo "Console output for the $route screen:"
              cat "ios-simulator-$route-console.log"
              echo "::error::The iOS $route launch never applied its route, so its screenshot proves nothing."
              exit 1
            fi
            if ! kill -0 "$route_pid" 2>/dev/null; then
              echo "Console output for the $route screen:"
              cat "ios-simulator-$route-console.log"
              echo "::error::Lazer exited while showing the iOS $route screen."
              exit 1
            fi
            xcrun simctl terminate "$simulator_udid" "$bundle_id" || true
            wait "$route_pid" || true
          done
      - name: Upload iOS Simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lazer-ios-simulator-diagnostics
          path: |
            ios-simulator-xcodebuild.log
            ios-simulator-console.log
            ios-simulator-runtime.log
            ios-simulator-sample.txt
            ios-simulator*.png
            ios-simulator-*-console.log
            ios-simulator-crash-reports/
          if-no-files-found: ignore
  # The device archive shares nothing with the simulator job above - it links the release
  # Kotlin/Native framework where the simulator links the debug one - so splitting them only ever
  # meant two runners working at the same time instead of one doing both back to back.
  ios-device:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-
      - name: Build unsigned iOS device app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM= \
            build | tee ios-xcodebuild.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path="$(find iosApp/build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p iosApp/build/ipa/Payload
          ditto "$app_path" iosApp/build/ipa/Payload/Lazer.app
          (
            cd iosApp/build/ipa
            zip -qry Lazer-unsigned.ipa Payload
          )
      - uses: actions/upload-artifact@v7
        with:
          name: lazer-ios-unsigned
          path: iosApp/build/ipa/Lazer-unsigned.ipa
          if-no-files-found: error
      - name: Upload Xcode log when the build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcodebuild-log
          path: ios-xcodebuild.log
          if-no-files-found: ignore

  # Version tags publish all deliverables uncompressed as release assets. Untagged builds leave
  # the corresponding Actions artifacts for platform testing.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop, linux-desktop, ios, ios-device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      # A bulk download succeeds even when an artifact is missing, which would quietly publish a
      # shorter release. The manifest below is what turns any dropped, renamed or double-produced
      # artifact into a failure that names it.
      - name: Collect release deliverables
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declare -A deliverables=(
            [lazer-apk-arm64]="Lazer-$version-android-arm64.apk"
            [lazer-msi]="Lazer-$version-windows-x64.msi"
            [lazer-jar-windows-x64]="Lazer-$version-windows-x64.jar"
            [lazer-windows-x64-portable]="Lazer-$version-windows-x64-portable.zip"
            [lazer-deb-x64]="Lazer-$version-linux-x64.deb"
            [lazer-rpm-x64]="Lazer-$version-linux-x64.rpm"
            [lazer-appimage-x64]="Lazer-$version-linux-x64.AppImage"
            [lazer-jar-linux-x64]="Lazer-$version-linux-x64.jar"
            [lazer-ios-unsigned]="Lazer-$version-ios-unsigned.ipa"
          )
          mkdir -p release
          missing=()
          for artifact in "${!deliverables[@]}"; do
            # Recursive because upload-artifact keeps the matched files under their parent
            # directories inside the artifact.
            files=($(find "artifacts/$artifact" -type f 2>/dev/null || true))
            if [ "${#files[@]}" -ne 1 ]; then
              missing+=("$artifact expected 1 file, found ${#files[@]}")
              continue
            fi
            cp "${files[0]}" "release/${deliverables[$artifact]}"
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Release deliverables incomplete: %s\n' "${missing[*]}"
            echo 'Artifact directories actually downloaded:'
            find artifacts -mindepth 1 -maxdepth 1 -type d -printf '  %f\n' | sort
            exit 1
          fi
          ls -l release
          sha256sum release/*
      - name: Record the commit every package carries
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "- Built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA (\`$short_sha\`), the commit each package names on its About page." > release-note.md
          if [ -f .github/release-template.md ]; then
            echo "" >> release-note.md
            cat .github/release-template.md >> release-note.md
          fi
          cat release-note.md >> "$GITHUB_STEP_SUMMARY"
      # Release titles use "Release X.Y", dropping the leading "v" from the tag.
      - name: Resolve release title
        id: title
        run: echo "value=Release ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # overwrite_files keeps a re-run of this job repairing one release instead of stacking
      # duplicate assets onto it.
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.title.outputs.value }}
          generate_release_notes: true
          append_body: true
          body_path: release-note.md
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release/Lazer-*.apk
            release/Lazer-*.msi
            release/Lazer-*.jar
            release/Lazer-*.deb
            release/Lazer-*.rpm
            release/Lazer-*.AppImage
            release/Lazer-*-portable.zip
            release/Lazer-*.ipa
